<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Registro y Asistencia</title>
  <link rel="stylesheet" href="./estilo.css">
</head>
<body>

  <div id="pantalla-login" class="contenedor-login">
    <form id="login-form" class="tarjeta-login">
      <h2>Iniciar Sesión</h2>
      <p class="subtitulo">Ingresa tus credenciales para acceder</p>
      
      <div class="grupo-input">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Ej. admin" required autocomplete="off">
      </div>

      <div class="grupo-input">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div id="login-error" class="mensaje-error"></div>

      <button type="submit" class="btn-login">Entrar al Sistema</button>
    </form>
  </div>


  <div id="sistema-principal" class="oculto">
    
    <header class="barra-superior">
      <h1>Panel de Control - Asistencia</h1>
      <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
    </header>

    <section id="pantalla-registro" class="tarjeta-sistema">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
        <h2>Registro de Estudiante</h2>
        <img src="./Imagenes/foto de modelo para los estudiantes de cada seccion del simon bolivar.webp" alt="Modelo de Estudiante" width="80" style="border-radius: 5px;">
      </div>
      <form id="registro-estudiante-form">
        <div class="grid-form">
          <div class="grupo-input">
            <label for="nombre">Nombre y Apellido</label>
            <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
          </div>
          <div class="grupo-input">
            <label for="cedula">Cédula / ID</label>
            <input type="text" id="cedula" required placeholder="Ej. V-12345678">
          </div>
          <div class="grupo-input">
            <label for="seccion">Sección / Curso</label>
            <input type="text" id="seccion" required placeholder="Ej. Primer año seccion A">
          </div>
        </div>
        <button type="submit" class="btn-agregar-estudiante">+ Agregar Estudiante</button>
      </form>

      <div class="contenedor-acciones-extra">
        <button id="btn-pasar-ano" class="btn-accion btn-pasar">🎓 Pasar de Año</button>
        <button id="btn-cambiar-seccion" class="btn-accion btn-cambiar">🔄 Cambiar de Sección</button>
      </div>
    </section>

    <section class="seccion-asistencia tarjeta-sistema">
      <div class="encabezado-tabla">
        <h2>Listado Oficial de Asistencia</h2>
        <button id="btn-imprimir-main" class="btn-imprimir">🖨️ Imprimir a Office / PDF</button>
      </div>

      <div class="contenedor-buscador">
        <label for="input-buscar" class="lbl-buscar">🔍 Buscar Estudiante:</label>
        <input type="text" id="input-buscar" placeholder="Ingrese nombre o cédula para buscar...">
      </div>

      <div class="contenedor-tabla">
        <table class="tabla-asistencia">
          <thead>
            <tr>
              <th>#</th>
              <th>Cédula / ID</th>
              <th>Nombre y Apellido</th>
              <th>Sección</th>
              <th>Sem 1</th>
              <th>Sem 2</th>
              <th>Sem 3</th>
              <th>Sem 4</th>
              <th>Sem 5</th>
              <th>Sem 6</th>
              <th>Sem 7</th>
              <th>Sem 8</th>
              <th>Sem 9</th>
              <th>Sem 10</th>
              <th>Sem 11</th>
              <th>Sem 12</th>
              <th class="col-acciones">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-cuerpo">
            </tbody>
        </table>
      </div>
    </section>

  </div>

  <script src="./index.js"></script>
</body>
</html>
