<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Registro y Asistencia</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <!-- =================================================================== -->
  <!-- 1. PANTALLA DE LOGIN DE INICIO                                       -->
  <!-- =================================================================== -->
  <div id="pantalla-login" class="contenedor-login">
    <form id="login-form" class="tarjeta-login">
      <h2>Iniciar Sesión</h2>
      <p class="subtitulo">Ingresa tus credenciales para acceder</p>
      
      <div class="grupo-input">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Ej. admin" required autocomplete="off">
      </div>

      <div class="grupo-input">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div id="login-error" class="mensaje-error"></div>

      <button type="submit" class="btn-login">Entrar al Sistema</button>
    </form>
  </div>


  <!-- =================================================================== -->
  <!-- 2. SISTEMA PRINCIPAL (OCULTO HASTA INICIAR SESIÓN)                 -->
  <!-- =================================================================== -->
  <div id="sistema-principal" class="oculto">
    
    <!-- BARRA SUPERIOR CON BOTÓN DE CERRAR SESIÓN -->
    <header class="barra-superior">
      <h1>Panel de Control - Asistencia</h1>
      <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
    </header>

    <!-- FORMULARIO DE REGISTRO DE ESTUDIANTES -->
    <section id="pantalla-registro" class="tarjeta-sistema">
      <h2>Registro de Estudiante</h2>
      <form id="registro-estudiante-form">
        <div class="grid-form">
          <div class="grupo-input">
            <label for="nombre">Nombre y Apellido</label>
            <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
          </div>
          <div class="grupo-input">
            <label for="cedula">Cédula / ID</label>
            <input type="text" id="cedula" required placeholder="Ej. V-12345678">
          </div>
          <div class="grupo-input">
            <label for="seccion">Sección / Curso</label>
            <input type="text" id="seccion" required placeholder="Ej. Sección A">
          </div>
        </div>
        <button type="submit" class="btn-agregar-estudiante">+ Agregar Estudiante</button>
      </form>
    </section>

    <!-- SECCIÓN DE LISTAS DE ASISTENCIA -->
    <section class="seccion-asistencia tarjeta-sistema">
      <div class="encabezado-tabla">
        <h2>Listado Oficial de Asistencia</h2>
        <button id="btn-imprimir-main" class="btn-imprimir">🖨️ Imprimir a Office / PDF</button>
      </div>

      <!-- TABLA DE ASISTENCIA -->
      <div class="contenedor-tabla">
        <table class="tabla-asistencia">
          <thead>
            <tr>
              <th>#</th>
              <th>Cédula / ID</th>
              <th>Nombre y Apellido</th>
              <th>Sección</th>
              <th>Lun</th>
              <th>Mar</th>
              <th>Mié</th>
              <th>Jue</th>
              <th>Vie</th>
              <th class="col-acciones">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-cuerpo">
            <!-- Los registros se cargan dinámicamente vía JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script src="index.js"></script>
</body>
</html>
